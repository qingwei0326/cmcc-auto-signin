name: tests

# 只跑单元测试：用例全部用临时目录与假响应，不读 configs/、不发任何真实请求，
# 所以凭证不会进 CI（README 里「不要用 GitHub Actions 跑」指的是签到任务本身）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是实际运行环境；Linux 用来覆盖文件锁的 fcntl 分支
        # ubuntu-latest 已升到 26.04，setup-python 不再提供 3.9；固定 24.04 才能继续测最低版本
        os: [windows-latest, ubuntu-24.04]
        # 3.9 是 README 承诺的最低版本，必须真的能跑
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check .
